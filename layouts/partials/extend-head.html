{{ $variant := site.Params.introSequence }}
{{ if and $variant (ne $variant false) }}
{{ $v := cond (eq (printf "%v" $variant) "true") "sentinel" (printf "%v" $variant) }}
<script>
(function () {
  var VARIANT = {{ $v }};

  try {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    if (sessionStorage.getItem('intro-seen')) return;
    // Home-only, but resolved from Hugo rather than hardcoded: on GitHub Pages
    // without a custom domain the site is served from a subpath (/site/), so a
    // literal '/' check would suppress the intro everywhere.
    var HOME = {{ site.Home.RelPermalink }};
    var here = window.location.pathname.replace(/index\.html$/, '');
    var strip = function (v) { return v.replace(/\/+$/, ''); };
    if (strip(here) !== strip(HOME)) return;
  } catch (e) { return; }

  var VARIANTS = {

    // --- Illustrated variants -------------------------------------------------

    sentinel: {
      art: '' +
        '<svg class="intro__art" viewBox="0 0 320 200" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
        '  <g class="intro__grid" stroke-width="0.6" opacity="0.28">' +
        '    <path d="M0 40h320M0 80h320M0 120h320M0 160h320"/>' +
        '    <path d="M40 0v200M80 0v200M120 0v200M160 0v200M200 0v200M240 0v200M280 0v200"/>' +
        '  </g>' +
        '  <g class="intro__figure">' +
        '    <path d="M160 92c-11 0-19 9-19 20v28h38v-28c0-11-8-20-19-20z"/>' +
        '    <path d="M146 96c0-14 6-24 14-24s14 10 14 24c0 8-6 13-14 13s-14-5-14-13z"/>' +
        '    <path d="M150 104h8M162 104h8"/>' +
        '  </g>' +
        '  <g class="intro__reticle">' +
        '    <circle cx="160" cy="112" r="46" stroke-dasharray="10 8"/>' +
        '    <path d="M160 52v16M160 156v16M100 112h16M204 112h16"/>' +
        '  </g>' +
        '  <line class="intro__scanline" x1="0" y1="0" x2="320" y2="0" stroke-width="1.6"/>' +
        '  <g class="intro__lock">' +
        '    <rect x="140" y="106" width="40" height="32" rx="5"/>' +
        '    <path class="intro__shackle" d="M149 106V96a11 11 0 0 1 22 0v10"/>' +
        '    <circle cx="160" cy="120" r="3.5"/><path d="M160 124v5"/>' +
        '  </g>' +
        '</svg>',
      steps: [
        { t: 'unidentified session detected',        cls: 'is-detect',  ms: 1150 },
        { t: 'scanning origin...',                   cls: 'is-scan',    ms: 1150 },
        { t: 'challenge issued  \u00b7  verifying',  cls: 'is-verify',  ms: 1150 },
        { t: 'access granted. welcome.',             cls: 'is-granted', ms: 1000 }
      ]
    },

    trace: {
      art: '' +
        '<svg class="intro__art" viewBox="0 0 320 180" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
        '  <path class="intro__wire" d="M34 90h72M134 90h52M214 90h72" stroke-dasharray="4 6" opacity="0.45"/>' +
        '  <g class="intro__nodes">' +
        '    <circle class="intro__node" cx="26" cy="90" r="11"/>' +
        '    <rect class="intro__gate" x="106" y="72" width="28" height="36" rx="5"/>' +
        '    <path class="intro__bricks" d="M112 80h16M112 90h16M112 100h16" stroke-width="1.6" opacity="0.7"/>' +
        '    <circle class="intro__auth" cx="200" cy="90" r="13"/>' +
        '    <path class="intro__authmark" d="M194 90h12M200 84v12" stroke-width="1.8"/>' +
        '    <circle class="intro__dest" cx="294" cy="90" r="11"/>' +
        '    <path class="intro__home" d="M288 92l6-6 6 6M291 90v8h6v-8" stroke-width="1.6"/>' +
        '  </g>' +
        '  <circle class="intro__packet" cx="26" cy="90" r="4.5" fill="currentColor" stroke="none"/>' +
        '  <g class="intro__deny"><path d="M112 74l16 32M128 74l-16 32" stroke-width="2.4"/></g>' +
        '</svg>',
      steps: [
        { t: 'inbound connection from unknown origin', cls: 'is-detect',  ms: 1150 },
        { t: 'perimeter policy  \u00b7  denied',        cls: 'is-deny',    ms: 1100 },
        { t: 'presenting credentials',                 cls: 'is-auth',    ms: 1150 },
        { t: 'route established. welcome.',            cls: 'is-granted', ms: 1000 }
      ]
    },

    biometric: {
      art: '' +
        '<svg class="intro__art intro__art--print" viewBox="0 0 200 220" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true">' +
        '  <g class="intro__ridges">' +
        '    <path d="M100 42c-32 0-58 26-58 58v34"/><path d="M100 60c-23 0-41 18-41 41v29"/>' +
        '    <path d="M100 78c-13 0-24 10-24 23v35"/><path d="M100 96c-4 0-7 3-7 7v45"/>' +
        '    <path d="M100 42c32 0 58 26 58 58v34"/><path d="M100 60c23 0 41 18 41 41v29"/>' +
        '    <path d="M100 78c13 0 24 10 24 23v35"/><path d="M100 96c4 0 7 3 7 7v45"/>' +
        '  </g>' +
        '  <rect class="intro__frame" x="38" y="34" width="124" height="152" rx="16" stroke-width="1.6" opacity="0.4"/>' +
        '  <line class="intro__beam" x1="42" y1="38" x2="158" y2="38" stroke-width="2"/>' +
        '  <path class="intro__check" d="M74 112l18 20 38-44" stroke-width="4"/>' +
        '</svg>',
      steps: [
        { t: 'place finger on reader',        cls: 'is-idle',    ms: 1000 },
        { t: 'capturing ridge pattern...',    cls: 'is-scan',    ms: 1250 },
        { t: 'matching against enrolled set', cls: 'is-match',   ms: 1150 },
        { t: 'identity confirmed. welcome.',  cls: 'is-granted', ms: 1000 }
      ]
    },

    // --- Terminal family ------------------------------------------------------

    terminal: {
      art: '',
      log: [
        { t: 'ssh visitor@christiancarrasco.dev' },
        { t: 'host key fingerprint verified',  cls: 'is-ok' },
        { t: 'authenticating', dots: true },
        { t: 'second factor required',         cls: 'is-warn' },
        { t: 'token accepted',                 cls: 'is-ok' },
        { t: 'access granted. welcome.',       cls: 'is-granted' }
      ]
    },

    // Brute force: attempts rip past in red until one lands.
    breach: {
      art: '',
      log: [
        { t: 'hydra -L users.txt -P rockyou.txt christiancarrasco.dev' },
        { t: 'wordlist loaded  \u00b7  14,344,391 entries', cls: 'is-dim' },
        { effect: 'cycle', cls: 'is-fail', ms: 1700, prefix: 'attempt ',
          pool: ['P@ssw0rd  FAILED', 'letmein1  FAILED', 'admin123  FAILED',
                 'qwerty!!  FAILED', 'Toyota20  FAILED', 'hunter2   FAILED',
                 'Summer26  FAILED', 'ch4ngeme  FAILED', 'iloveyou  FAILED',
                 'trustno1  FAILED'],
          final: '\u2022\u2022\u2022\u2022\u2022\u2022\u2022\u2022\u2022\u2022  MATCH', finalCls: 'is-ok' },
        { t: 'lockout policy  \u00b7  not enforced', cls: 'is-warn' },
        { t: 'session established. welcome.',        cls: 'is-granted' }
      ]
    },

    // Kill chain: recon, vector, payload, shell, root.
    exploit: {
      art: '',
      log: [
        { t: 'nmap -sV -Pn christiancarrasco.dev' },
        { t: '443/tcp  open  https   nginx', cls: 'is-dim' },
        { effect: 'bar', ms: 1300, label: 'enumerating endpoints' },
        { t: 'candidate vector identified  \u00b7  CVE-████-█████', cls: 'is-warn' },
        { t: 'staging payload', dots: true },
        { t: 'shell obtained  \u00b7  uid=0(root)', cls: 'is-ok' },
        { t: 'welcome. make yourself at home.', cls: 'is-granted' }
      ]
    },

    // Cipher break: scrambled glyphs resolve into plaintext.
    decrypt: {
      art: '',
      log: [
        { t: 'intercepting session  \u00b7  AES-256-GCM' },
        { t: 'deriving key', dots: true },
        { effect: 'scramble', ms: 1400, target: 'CHRISTIAN CARRASCO', cls: 'is-ok' },
        { t: 'plaintext recovered', cls: 'is-dim' },
        { effect: 'scramble', ms: 1100, target: 'ACCESS GRANTED', cls: 'is-granted' }
      ]
    }
  };

  var conf = VARIANTS[VARIANT] || VARIANTS.sentinel;

  document.addEventListener('DOMContentLoaded', function () {
    var base = 'intro intro--' + VARIANT;
    var host = document.createElement('div');
    host.className = base;
    host.setAttribute('role', 'presentation');
    host.setAttribute('aria-hidden', 'true');

    var inner = '<div class="intro__scene">' + conf.art;
    inner += conf.log
      ? '<div class="intro__log"></div>'
      : '<p class="intro__line"><span class="intro__prompt">&gt;</span> <span class="intro__text"></span><span class="intro__cursor"></span></p>';
    inner += '</div><button class="intro__skip" type="button">Skip</button>';
    host.innerHTML = inner;

    document.body.appendChild(host);
    document.documentElement.classList.add('intro-active');

    var timers = [];
    var intervals = [];
    var done = false;

    function finish() {
      if (done) return;
      done = true;
      timers.forEach(clearTimeout);
      intervals.forEach(clearInterval);
      try { sessionStorage.setItem('intro-seen', '1'); } catch (e) {}
      host.classList.add('intro--out');
      document.documentElement.classList.remove('intro-active');
      setTimeout(function () { host.remove(); }, 650);
      document.removeEventListener('keydown', onKey);
    }

    function onKey(e) { if (e.key === 'Escape' || e.key === 'Enter' || e.key === ' ') finish(); }

    var GLYPHS = '!<>-_\\/[]{}\u2014=+*^?#01ABCDEF';

    function newRow(cls) {
      var p = document.createElement('p');
      p.className = 'intro__row ' + (cls || '');
      p.innerHTML = '<span class="intro__prompt">&gt;</span> <span class="intro__body"></span>';
      return p;
    }

    var elapsed = 0;

    if (conf.log) {
      var logEl = host.querySelector('.intro__log');

      conf.log.forEach(function (row, i) {
        timers.push(setTimeout(function () {
          if (done) return;
          var oldCaret = logEl.querySelector('.intro__cursor');
          if (oldCaret) oldCaret.remove();

          var p = newRow(row.cls);
          logEl.appendChild(p);
          var body = p.querySelector('.intro__body');

          if (row.effect === 'cycle') {
            // rapid-fire failed attempts, then settle on the hit
            var n = 0;
            var iv = setInterval(function () {
              body.textContent = (row.prefix || '') + row.pool[n % row.pool.length];
              n++;
            }, 85);
            intervals.push(iv);
            timers.push(setTimeout(function () {
              clearInterval(iv);
              if (done) return;
              p.className = 'intro__row ' + (row.finalCls || '');
              body.textContent = (row.prefix || '') + row.final;
            }, row.ms - 120));

          } else if (row.effect === 'scramble') {
            var target = row.target;
            var frame = 0;
            var total = Math.max(12, Math.round(row.ms / 45));
            var iv2 = setInterval(function () {
              var out = '';
              for (var c = 0; c < target.length; c++) {
                if (target[c] === ' ') { out += ' '; continue; }
                var settleAt = (c / target.length) * total * 0.7;
                out += (frame > settleAt + 4)
                  ? target[c]
                  : GLYPHS[Math.floor(Math.random() * GLYPHS.length)];
              }
              body.textContent = out;
              frame++;
              if (frame > total) { clearInterval(iv2); body.textContent = target; }
            }, 45);
            intervals.push(iv2);

          } else if (row.effect === 'bar') {
            body.innerHTML = row.label + ' <span class="intro__bar"><i style="animation-duration:' + row.ms + 'ms"></i></span>';

          } else {
            body.textContent = row.t;
            if (row.dots) {
              var d = document.createElement('span');
              d.className = 'intro__dots';
              body.appendChild(d);
            }
          }

          var caret = document.createElement('span');
          caret.className = 'intro__cursor';
          p.appendChild(caret);

          if (row.cls === 'is-granted' || row.finalCls === 'is-granted') {
            host.className = base + ' is-granted';
          }
        }, elapsed));

        elapsed += row.ms ? row.ms + 180 : (i === 0 ? 620 : 800);
      });
      elapsed += 900;

    } else {
      var textEl = host.querySelector('.intro__text');
      conf.steps.forEach(function (step) {
        timers.push(setTimeout(function () {
          if (done) return;
          host.className = base + ' ' + step.cls;
          textEl.textContent = step.t;
        }, elapsed));
        elapsed += step.ms;
      });
    }

    timers.push(setTimeout(finish, elapsed));

    host.querySelector('.intro__skip').addEventListener('click', finish);
    host.addEventListener('click', finish);
    document.addEventListener('keydown', onKey);
  });
})();
</script>

<script>
(function () {
  // Hero name resolves out of random glyphs once on arrival.
  try {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  } catch (e) { return; }

  document.addEventListener('DOMContentLoaded', function () {
    var el = document.querySelector('.hero-name[data-scramble]');
    if (!el) return;
    var span = el.querySelector('.hero-name__text');
    if (!span) return;

    var target = el.getAttribute('data-scramble') || span.textContent;
    var GLYPHS = '!<>-_\\/[]{}\u2014=+*^?#01ABCDEF';

    // Wait for the intro overlay to clear, if one is running.
    var delay = document.querySelector('.intro') ? 400 : 250;

    setTimeout(function () {
      el.setAttribute('data-scrambling', '');

      // Phase 1 — glyphs churn and resolve into the name, monospace so the
      // characters sit on an even grid and nothing reflows.
      var frame = 0;
      var total = 26;
      var iv = setInterval(function () {
        var out = '';
        for (var c = 0; c < target.length; c++) {
          if (target[c] === ' ') { out += ' '; continue; }
          var settleAt = (c / target.length) * total * 0.72;
          out += (frame > settleAt + 3)
            ? target[c]
            : GLYPHS[Math.floor(Math.random() * GLYPHS.length)];
        }
        span.textContent = out;
        frame++;
        if (frame > total) { clearInterval(iv); rewind(); }
      }, 42);

      // Phase 2 — the shell walks it back, deleting right to left.
      function rewind() {
        el.removeAttribute('data-scrambling');
        el.setAttribute('data-typing', '');
        var i = target.length;
        var back = setInterval(function () {
          i--;
          span.textContent = target.slice(0, i);
          if (i <= 0) { clearInterval(back); setTimeout(retype, 150); }
        }, 22);
      }

      // Phase 3 — retyped forward in the display face, caret trailing.
      function retype() {
        var j = 0;
        var fwd = setInterval(function () {
          j++;
          span.textContent = target.slice(0, j);
          if (j >= target.length) {
            clearInterval(fwd);
            // caret blinks a couple of times, then the line comes to rest
            setTimeout(function () {
              el.removeAttribute('data-typing');
              el.setAttribute('data-rested', '');
            }, 700);
          }
        }, 34);
      }
    }, delay);
  });
})();
</script>
