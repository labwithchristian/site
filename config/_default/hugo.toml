# -- Site Configuration --
# https://blowfish.page/docs/configuration/

baseURL = "https://christiancarrasco.dev/"
theme = "blowfish"
defaultContentLanguage = "en"

enableRobotsTXT = true
enableEmoji = true
summaryLength = 0

[pagination]
  pagerSize = 10

[taxonomies]
  tag = "tags"
  # No categories taxonomy: nothing uses it, and it only produced an empty
  # /categories/ page. Tags cover grouping. Add the line back to restore it.

[outputs]
  home = ["HTML", "RSS", "JSON"]

[related]
  threshold = 0
  toLower = false
  [[related.indices]]
    name = "tags"
    weight = 100

[sitemap]
  changefreq = "weekly"
  filename = "sitemap.xml"
  priority = 0.5
