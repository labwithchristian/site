    proof_label: scorecard
    writeup_url: ""
    # rank / field: overall placement among all Individual Game players,
    # shown on /ctf with the top percentage worked out from them.
    # Module completion from the Cyber Skyline scorecard (the Survey module is
    # left out: it is a questionnaire, not a challenge). The signal panel on
    # /ctf opens on the newest event with a result and compares it with the
    # previous event from the same organiser (rank, points, accuracy,
    # completion and each module), so keep those fields on both seasons.
    modules:
      - { name: osint, pct: 100 }
      - { name: wireless access, pct: 92 }
      - { name: network traffic, pct: 91 }
      - { name: password cracking, pct: 89 }
      - { name: cryptography, pct: 81 }
      - { name: log analysis, pct: 71 }
      - { name: web app, pct: 67 }
      - { name: scanning, pct: 18 }
      - { name: exploitation, pct: 17 }

