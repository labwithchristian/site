# CTF record: the single source for the /ctf page, the "Competing next" line on
# the resume, and the Huntress row in the homepage's What's Cooking list.
#
# Scope: timed, scored competitions only. Practice platforms (retired Hack The
# Box Sherlocks, CyberDefenders) belong to the homelab and writeups, not here.
#
# Status is worked out from the dates, at build time and again in the browser
# on /ctf, so the page moves on its own:
#   upcoming  before start
#   live      between start and end
#   closed    after end, before a result is filled in
#   results   once `result` is filled in
# Past events without exact dates set `done: true` instead.
#
# After an event closes, see "CTF record" in README.md for the proof checklist.
# No em or en dashes in any text here: it feeds the resume.

events:
  - id: huntress-2026
    name: Huntress CTF 2026
    org: Huntress
    note: Cybersecurity Awareness Month
    tag: "2026.O"
    season: October 2026
    # Start and end assume midnight US Eastern. Confirm both against the
    # registration email and adjust if Huntress publishes a different time.
    start: "2026-10-01T00:00:00-04:00"
    end: "2026-10-31T23:59:00-04:00"
    crew: solo
    format: daily challenge drops
    focus: [malware, forensics, osint, scripting]
    url: https://ctf.huntress.com/
    handle: ""
    result: ""
    proof_url: ""
    proof_label: ""
    writeup_url: ""

