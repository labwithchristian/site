<!-- Site search icon, replacing the theme's filled magnifier (themes/blowfish/
     assets/icons/search.svg). A pan seen from above: the lens doubles as the
     pan, the handle carries a hang hole, and three wisps rise off it. Drawn at
     the same stroke weight as the terminal pot beside it in the nav, so the
     pill reads as one set. The wisps animate through .sr-wisp in 30-nav.css.
     Keep this comment first: a file starting with a bare <svg> tag can pick up
     embedded provenance metadata when synced through some desktop tools. -->
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
  <circle cx="10.5" cy="10.5" r="6.6"/>
  <path d="M15.4 15.4l3.38 3.38" stroke-width="2.3"/>
  <circle cx="20" cy="20" r="1.75" stroke-width="1.35"/>
  <g stroke-width="1.3">
    <path class="sr-wisp" d="M7.9 13.4c-.65-.85.65-1.3 0-2.15s.45-1.15.45-1.15"/>
    <path class="sr-wisp sr-wisp--2" d="M10.5 13.1c-.7-.9.7-1.4 0-2.3s.5-1.25.5-1.25"/>
    <path class="sr-wisp sr-wisp--3" d="M13.1 13.4c-.65-.85.65-1.3 0-2.15s.45-1.15.45-1.15"/>
  </g>
</svg>
